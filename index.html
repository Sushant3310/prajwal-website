<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — Access Redirected</title>
<style>
  :root{
    --bg:#03070a; --line:#0f2a1c; --green:#39ff8f; --green-dim:#1c8a54; --text:#d9ffe9;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(57,255,143,0.035) 0px, rgba(57,255,143,0.035) 1px, transparent 1px, transparent 3px),
      radial-gradient(900px 500px at 50% 20%, rgba(57,255,143,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Courier New', ui-monospace, monospace;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    overflow:hidden;
  }
  .wrap{
    max-width:640px; width:100%; text-align:center;
    border:1px solid var(--green-dim);
    border-radius:6px;
    padding:44px 28px;
    background:rgba(6,16,11,0.6);
    box-shadow:0 0 60px rgba(57,255,143,0.08), inset 0 0 40px rgba(57,255,143,0.03);
    position:relative;
  }
  .tag{
    display:inline-block; font-size:12px; letter-spacing:2px; color:var(--green-dim);
    border:1px solid var(--green-dim); border-radius:999px; padding:4px 12px; margin-bottom:22px;
  }
  .code{
    font-size:clamp(54px,14vw,96px); font-weight:700; color:var(--green);
    text-shadow:0 0 10px rgba(57,255,143,0.6), 0 0 30px rgba(57,255,143,0.25);
    line-height:1; position:relative; animation:glitch 2.6s infinite;
  }
  @keyframes glitch{
    0%,93%,100%{ transform:translate(0,0); text-shadow:0 0 10px rgba(57,255,143,0.6),0 0 30px rgba(57,255,143,0.25); }
    94%{ transform:translate(-2px,1px); text-shadow:-2px 0 #ff3b3b, 2px 0 #3bb2ff; }
    95%{ transform:translate(2px,-1px); text-shadow:2px 0 #ff3b3b, -2px 0 #3bb2ff; }
    96%{ transform:translate(-1px,0); text-shadow:0 0 10px rgba(57,255,143,0.6); }
  }
  h1{ margin-top:14px; font-size:20px; letter-spacing:1px; color:var(--text) }
  .msg{ margin-top:22px; line-height:1.8; color:#9fe8bd; font-size:15px }
  .msg b{ color:var(--green) }
  .blink{ display:inline-block; width:9px; height:16px; background:var(--green); margin-left:4px; vertical-align:-3px; animation:blink 1s step-start infinite }
  @keyframes blink{ 50%{ opacity:0 } }
  .stamp{ margin-top:30px; font-size:12px; color:var(--green-dim); letter-spacing:1px }
  .retry{
    display:inline-block; margin-top:26px; padding:10px 20px; border-radius:4px;
    border:1px solid var(--green-dim); color:var(--green); text-decoration:none; font-size:13px;
    letter-spacing:1px; transition:background 200ms ease, color 200ms ease;
  }
  .retry:hover{ background:var(--green); color:#03070a }
  @media (prefers-reduced-motion: reduce){ .code{ animation:none } .blink{ animation:none } }
</style>
</head>
<body>
  <div class="wrap">
    <span class="tag">SYSTEM NOTICE</span>
    <div class="code">404</div>
    <h1>PAGE NOT FOUND</h1>
    <p class="msg">
      Prajwal Subedi is soo busy nowadays, so his big brother
      <b>Sushant Badal</b> now has access to this website<span class="blink"></span><br><br>
      Try again later !! 👌<br>
      Simply telling — this is <b>HACKED</b> !!
    </p>
    <div class="stamp">STATUS: REDIRECTED · ACCESS: BIG BROTHER MODE</div>
    <a class="retry" href="#" onclick="location.reload();return false;">↻ Try again</a>
  </div>
</body>
</html>
